name: Release gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Unit and static gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-groups
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest -q tests/unit
      - run: uv run python scripts/release_gates.py describe --output release-gate-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-gate-manifest-py${{ matrix.python-version }}
          path: release-gate-manifest.json

  hermes-provider-contract-gate:
    name: Hermes 0.18.2 provider contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked --all-groups
      - run: uv run python -c "import importlib.metadata as m; assert m.version('hermes-agent') == '0.18.2'"
      - run: uv run pytest -q -m contract tests/contract
